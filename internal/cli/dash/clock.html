<!doctype html>
<meta charset="utf-8">
<title>tvctl clock</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e12; color: #e8e8e8; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { background: radial-gradient(1200px 700px at 30% 20%, #1a2230 0%, #0b0e12 60%); }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  .time { font-size: 22vw; font-weight: 200; letter-spacing: -0.03em; line-height: 1;
    font-variant-numeric: tabular-nums; }
  .time small { font-size: 6vw; font-weight: 300; color: #8e97a3; margin-left: 1.5vw; }
  .date { margin-top: 2vh; font-size: 3.6vw; font-weight: 300; color: #aab3bf; letter-spacing: 0.02em; }
  .now { position: absolute; bottom: 5vh; left: 0; right: 0; text-align: center;
    font-size: 2.2vw; color: #8e97a3; opacity: 0; transition: opacity .6s; }
  .now.on { opacity: 1; }
  .now b { color: #e8e8e8; font-weight: 500; }
  .dot { display: inline-block; width: .8vw; height: .8vw; border-radius: 50%;
    background: #4ade80; margin-right: .8vw; vertical-align: middle; }
  .dot.paused { background: #facc15; }
</style>
<div class="wrap">
  <div class="time"><span id="hm">--:--</span><small id="ampm"></small></div>
  <div class="date" id="date"></div>
</div>
<div class="now" id="now"></div>
<script>
  const pad = n => String(n).padStart(2, '0');
  function tick() {
    const d = new Date();
    let h = d.getHours(); const ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    document.getElementById('hm').textContent = h + ':' + pad(d.getMinutes());
    document.getElementById('ampm').textContent = ampm;
    document.getElementById('date').textContent =
      d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  function nowPlaying() {
    try {
      const n = JSON.parse(window.tvctl ? tvctl.now() : '{}');
      const el = document.getElementById('now');
      if (n && n.app && (n.title || n.state === 'playing' || n.state === 'paused')) {
        const name = n.title || n.app;
        const by = n.artist ? ' · ' + n.artist : '';
        el.innerHTML = '<span class="dot ' + (n.state === 'paused' ? 'paused' : '') + '"></span><b>' + esc(name) + '</b>' + esc(by);
        el.classList.add('on');
      } else el.classList.remove('on');
    } catch (e) {}
  }
  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  tick(); nowPlaying();
  setInterval(tick, 1000); setInterval(nowPlaying, 3000);
</script>
